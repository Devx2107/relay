name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Run Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates (format, lint, typecheck, test, build)
        run: npm run verify
        env:
          # Ensure NEXT_TELEMETRY_DISABLED is set to speed up builds
          NEXT_TELEMETRY_DISABLED: 1
